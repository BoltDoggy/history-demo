<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ece1c8">
<title>华夏长卷 · 历史关键节点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece1c8;
  --paper-2:#f7f0dd;
  --ink:#2b2620;
  --ink-2:#5a5142;
  --ink-3:#8a7f68;
  --cinnabar:#a63b28;
  --edge:52px;
  --font-brush:'Ma Shan Zheng','Kaiti SC','STKaiti','KaiTi',serif;
  --font-kai:'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif;
  --font-song:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#0e0b08;
  color:var(--ink);
  font-family:var(--font-song);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
.stage{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(130% 90% at 50% -10%, #f6eeda 0%, var(--paper) 55%, #ddcda9 100%);
  user-select:none;
  -webkit-user-select:none;
  animation:stage-in 1.4s ease both;
}
@keyframes stage-in{from{opacity:0}to{opacity:1}}

#viewport{
  position:absolute;inset:0 var(--edge);
  overflow:hidden;
  cursor:grab;
  touch-action:none;
  z-index:10;
}
#viewport.grabbing{cursor:grabbing}

.bg{position:absolute;inset:0;pointer-events:none;background-repeat:repeat-x;background-position:left bottom}
#sunLayer{
  inset:auto;left:62%;top:13%;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%, #d96a4e, #ad3a26 72%);
  opacity:.7;
  box-shadow:0 0 34px 10px rgba(173,58,38,.18);
}
#farLayer{
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1440' height='340' viewBox='0 0 1440 340'%3E%3Cpath d='M0 268 L120 210 L235 252 L355 158 L470 228 L590 168 L705 246 L830 148 L950 224 L1070 172 L1190 248 L1315 186 L1440 268 L1440 340 L0 340 Z' fill='%232b2620' fill-opacity='0.10'/%3E%3C/svg%3E");
  background-size:120vw auto;
}
#midLayer{
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1152' height='300' viewBox='0 0 1152 300'%3E%3Cpath d='M0 232 L110 152 L215 208 L330 122 L450 198 L565 142 L680 214 L800 128 L915 202 L1030 150 L1152 232 L1152 300 L0 300 Z' fill='%23292520' fill-opacity='0.17'/%3E%3C/svg%3E");
  background-size:96vw auto;
}
#nearLayer{
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='960' height='240' viewBox='0 0 960 240'%3E%3Cpath d='M0 196 L105 112 L205 168 L315 88 L430 162 L540 104 L650 172 L765 96 L865 160 L960 124 L960 240 L0 240 Z' fill='%23201c17' fill-opacity='0.24'/%3E%3C/svg%3E");
  background-size:78vw auto;
}
.mist{
  position:absolute;left:-10%;right:-10%;bottom:0;height:46%;pointer-events:none;
  background:
    radial-gradient(52% 62% at 26% 100%, rgba(248,243,229,.88), transparent 70%),
    radial-gradient(44% 58% at 70% 100%, rgba(248,243,229,.8), transparent 70%),
    radial-gradient(38% 50% at 46% 100%, rgba(248,243,229,.7), transparent 72%);
  animation:drift-a 52s ease-in-out infinite alternate;
}
.mist.m2{
  height:34%;opacity:.8;animation-duration:74s;animation-direction:alternate-reverse;
  background:
    radial-gradient(46% 60% at 58% 100%, rgba(250,246,233,.85), transparent 70%),
    radial-gradient(40% 55% at 18% 100%, rgba(250,246,233,.75), transparent 72%);
}
@keyframes drift-a{from{transform:translateX(-3.5%)}to{transform:translateX(3.5%)}}
@media (prefers-reduced-motion:reduce){.mist{animation:none}}

#track{
  position:relative;display:flex;align-items:stretch;height:100%;width:max-content;
  will-change:transform;
}
.axis{
  position:absolute;left:0;right:0;top:var(--axisY,50%);height:3px;transform:translateY(-50%);
  transition:top .5s ease;
  background:linear-gradient(90deg, transparent, rgba(58,52,42,.55) 3%, rgba(58,52,42,.55) 97%, transparent);
}
.axis::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(236,225,200,.28) 0 3px, transparent 3px 9px);
}

.panel{
  flex:0 0 auto;width:clamp(300px,36vw,540px);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.intro{margin-right:6vw}
.outro{margin-left:6vw}
.intro-core{display:flex;align-items:center;gap:26px}
.vcol{display:flex;flex-direction:column;align-items:center;gap:20px}
.vsub{
  writing-mode:vertical-rl;letter-spacing:.42em;
  font-family:var(--font-song);font-size:16px;color:var(--ink-2);
}
.vtitle{
  writing-mode:vertical-rl;letter-spacing:.28em;
  font-family:var(--font-brush);font-size:clamp(44px,4.6vw,66px);
  color:#2b2620;line-height:1.25;
}
.outro .vtitle{font-size:clamp(34px,3.4vw,48px)}
.outro .vsub{font-size:14px}
.seal{
  display:inline-flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:6px;
  background:var(--cinnabar);color:#f8f1de;
  font-family:var(--font-kai);font-size:19px;
  writing-mode:vertical-rl;letter-spacing:3px;
  box-shadow:inset 0 0 0 2px rgba(248,241,222,.35), 0 2px 8px rgba(80,30,16,.25);
}
.intro-hint{
  position:absolute;bottom:9%;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:12.5px;letter-spacing:3px;color:var(--ink-3);
  font-family:var(--font-song);
}

.node{
  position:relative;flex:0 0 auto;width:320px;margin-right:170px;height:100%;
  cursor:pointer;
}
.dot{
  position:absolute;left:50%;top:var(--axisY,50%);width:17px;height:17px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:var(--paper-2);border:3px solid rgba(58,52,42,.75);
  transition:background .3s,border-color .3s,box-shadow .3s,top .5s ease;
  z-index:2;
}
.connector{
  position:absolute;left:calc(50% - 1px);width:2px;
  transition:top .5s ease,bottom .5s ease;
  background:linear-gradient(180deg, rgba(58,52,42,.12), rgba(58,52,42,.55));
}
.up .connector{bottom:calc(100% - var(--axisY,50%));height:46px}
.down .connector{top:var(--axisY,50%);height:46px;background:linear-gradient(0deg, rgba(58,52,42,.12), rgba(58,52,42,.55))}
.card{
  position:absolute;left:50%;transform:translateX(-50%);
  width:302px;padding:18px 22px 17px;
  background:rgba(251,246,232,.78);
  border:1px solid rgba(96,76,44,.28);
  border-radius:3px;
  box-shadow:0 10px 26px -16px rgba(43,38,32,.45), inset 0 0 0 4px rgba(255,255,255,.25);
  transition:border-color .3s,box-shadow .3s,top .5s ease,bottom .5s ease;
}
.up .card{bottom:calc(100% - var(--axisY,50%) + 58px)}
.down .card{top:calc(var(--axisY,50%) + 58px)}
.chip{
  display:inline-block;padding:2px 10px;margin-bottom:8px;
  font-size:11px;letter-spacing:3px;color:var(--ink-2);
  border:1px solid rgba(90,81,66,.35);border-radius:999px;
  font-family:var(--font-song);
}
.year{
  font-family:var(--font-brush);font-weight:400;font-size:34px;line-height:1.1;
  color:#3a332a;transition:color .3s;
}
.year em{font-style:normal;font-size:19px;margin-right:5px;color:var(--ink-2)}
.title{
  font-family:var(--font-kai);font-size:21px;font-weight:600;
  margin:2px 0 7px;color:#2b2620;letter-spacing:2px;
}
.desc{
  font-size:13.5px;line-height:1.95;color:var(--ink-2);
  font-family:var(--font-song);text-align:justify;
}
.node.active .dot{
  background:var(--cinnabar);border-color:var(--cinnabar);
  box-shadow:0 0 0 7px rgba(166,59,40,.16);
}
.node.active .card{
  border-color:rgba(166,59,40,.5);
  box-shadow:0 16px 32px -16px rgba(43,38,32,.5), inset 0 0 0 4px rgba(255,255,255,.28);
}
.node.active .year{color:var(--cinnabar)}

.edge{position:absolute;top:0;bottom:0;width:90px;pointer-events:none;z-index:20}
.edge-l{left:0;background:linear-gradient(90deg, rgba(56,38,18,.24), transparent)}
.edge-r{right:0;background:linear-gradient(270deg, rgba(56,38,18,.24), transparent)}

.roller{
  position:absolute;top:0;bottom:0;width:34px;z-index:30;pointer-events:none;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.26) 0 2px, transparent 2px 6px),
    linear-gradient(90deg, #1c110a, #4d3823 20%, #6f5130 50%, #3d2a17 80%, #140c06);
}
.roller-l{left:8px}
.roller-r{right:8px}
.cap{
  position:absolute;left:2px;right:2px;height:15px;border-radius:4px;
  background:linear-gradient(180deg,#d3ab5f,#7c5a22);
  box-shadow:0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,240,200,.55);
}
.cap-t{top:-9px}
.cap-b{bottom:-9px}

.hud{
  position:fixed;top:18px;left:calc(var(--edge) + 22px);right:calc(var(--edge) + 22px);
  display:flex;align-items:flex-start;gap:26px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;padding-top:2px}
.brand .seal{width:34px;height:34px;font-size:14px;border-radius:5px}
.brand span:last-child{
  font-family:var(--font-kai);font-size:17px;letter-spacing:5px;color:#3a342b;white-space:nowrap;
}
.progress{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.track-bar{
  position:relative;width:100%;max-width:820px;height:4px;border-radius:99px;
  background:rgba(43,38,32,.16);
}
.fill{
  position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
  background:linear-gradient(90deg,#7c2d1e,var(--cinnabar));
}
.tick{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:9px;height:9px;border-radius:50%;padding:0;
  background:var(--paper-2);border:1.5px solid rgba(58,52,42,.5);
  cursor:pointer;transition:transform .25s,background .25s,border-color .25s;
}
.tick:hover{transform:translate(-50%,-50%) scale(1.3)}
.tick.active{background:var(--cinnabar);border-color:var(--cinnabar);transform:translate(-50%,-50%) scale(1.25)}
.era{
  font-family:var(--font-kai);font-size:15px;letter-spacing:4px;color:var(--ink-2);
  min-height:22px;white-space:nowrap;
}

.hint{
  position:fixed;bottom:68px;left:50%;transform:translateX(-50%);
  z-index:45;pointer-events:none;
  padding:8px 20px;border-radius:999px;
  background:rgba(43,38,32,.06);border:1px solid rgba(43,38,32,.16);
  font-size:12.5px;letter-spacing:3px;color:var(--ink-2);font-family:var(--font-song);
  transition:opacity .8s,visibility .8s;white-space:nowrap;
}
.hint.hidden{opacity:0;visibility:hidden}

.grain{
  position:fixed;inset:0;z-index:50;pointer-events:none;
  opacity:.055;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='260' height='260' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
}

#ganttToggle{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:44;
  display:flex;align-items:center;gap:8px;height:34px;padding:0 18px;border-radius:999px;
  border:1px solid rgba(96,76,44,.35);background:rgba(251,246,232,.92);
  color:#3a342b;font-family:var(--font-kai);font-size:13.5px;letter-spacing:3px;cursor:pointer;
  box-shadow:0 4px 14px -6px rgba(30,20,8,.35);
  transition:opacity .3s,transform .2s;
}
#ganttToggle:hover{transform:translateX(-50%) translateY(-1px)}
body.gantt-open #ganttToggle{opacity:0;pointer-events:none}

#gantt{
  position:fixed;left:44px;right:44px;bottom:0;height:min(52vh,540px);z-index:46;
  background:linear-gradient(180deg,#f6efdc,#efe5cb);
  border:1px solid rgba(96,76,44,.3);border-bottom:none;border-radius:10px 10px 0 0;
  box-shadow:0 -12px 40px -12px rgba(30,20,8,.35);
  transform:translateY(105%);visibility:hidden;
  transition:transform .55s cubic-bezier(.22,.9,.26,1),visibility 0s .55s;
}
#gantt.open{transform:translateY(0);visibility:visible;transition:transform .55s cubic-bezier(.22,.9,.26,1),visibility 0s 0s}
.g-head{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(96,76,44,.2)}
.g-title{font-family:var(--font-kai);font-size:14.5px;letter-spacing:3px;color:#3a342b;margin-right:auto}
.g-btn{
  height:26px;padding:0 12px;font-size:12px;letter-spacing:1px;color:var(--ink-2);
  background:rgba(255,253,246,.6);border:1px solid rgba(96,76,44,.3);border-radius:6px;
  cursor:pointer;font-family:var(--font-song);
}
.g-btn:hover{background:rgba(43,38,32,.08)}
.g-body{position:absolute;top:44px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.g-body::-webkit-scrollbar{width:8px}
.g-body::-webkit-scrollbar-thumb{background:rgba(90,81,66,.3);border-radius:4px}
.g-main{position:relative;min-height:100%}
.g-lbl{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:11.5px;color:var(--ink-2);font-family:var(--font-kai);
  letter-spacing:1px;white-space:nowrap;pointer-events:none;
}
.g-axis{height:30px;position:sticky;top:0;z-index:2;background:#f3ecd9}
.g-tick{
  position:absolute;top:7px;transform:translateX(-50%);
  font-size:10.5px;color:var(--ink-3);font-family:var(--font-song);white-space:nowrap;
}
.g-canvas{position:relative}
.g-row{position:absolute;left:0;right:0;height:26px}
.g-row:hover{background:rgba(43,38,32,.045)}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(43,38,32,.08)}
.g-bar{
  position:absolute;top:4px;height:18px;border-radius:3px;border:1px solid;opacity:.88;
  cursor:pointer;transition:opacity .2s,box-shadow .2s;
}
.g-bar:hover{opacity:1}
.g-bar.on{opacity:1;box-shadow:0 0 0 2px rgba(166,59,40,.3);border-color:#a63b28}
.g-bar span{
  position:absolute;left:6px;top:50%;transform:translateY(-50%);
  color:#f6efdd;font-size:11px;letter-spacing:1px;white-space:nowrap;
  font-family:var(--font-song);pointer-events:none;
}
.g-play{
  position:absolute;top:30px;bottom:0;width:2px;background:var(--cinnabar);z-index:4;
  box-shadow:0 0 6px rgba(166,59,40,.45);transition:left .35s ease;pointer-events:none;
}
.g-play i{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:var(--cinnabar);color:#f8f1de;font-style:normal;
  font-size:10.5px;letter-spacing:1px;padding:2px 8px;border-radius:3px;white-space:nowrap;
  max-width:34vw;overflow:hidden;text-overflow:ellipsis;
}
.g-tip{
  position:absolute;z-index:6;pointer-events:none;display:none;
  background:#fbf6e8;border:1px solid rgba(96,76,44,.35);border-radius:4px;
  box-shadow:0 8px 20px -8px rgba(43,38,32,.4);
  padding:8px 12px;min-width:170px;max-width:260px;
}
.g-tip b{font-family:var(--font-kai);font-size:13.5px;font-weight:600;display:block;margin-bottom:2px}
.g-tip .y{font-size:11px;color:var(--ink-2);display:block;margin-bottom:3px;letter-spacing:.5px}
.g-tip p{font-size:11px;color:var(--ink-2);line-height:1.65;margin:0}

body.gantt-open #viewport{--axisY:32%}
body.gantt-open .node .connector{height:40px}
body.gantt-open .card{width:264px;padding:12px 15px 11px}
body.gantt-open .chip{margin-bottom:5px;font-size:10px;letter-spacing:2px}
body.gantt-open .year{font-size:25px}
body.gantt-open .year em{font-size:15px}
body.gantt-open .title{font-size:17px;margin:1px 0 5px}
body.gantt-open .desc{font-size:12px;line-height:1.7}
body.gantt-open .up .card{bottom:calc(100% - var(--axisY) + 52px)}
body.gantt-open .down .card{top:auto;bottom:calc(100% - var(--axisY) + 52px)}
body.gantt-open .down .connector{top:auto;bottom:calc(100% - var(--axisY))}

@media (max-height:660px){
  .card{width:262px;padding:13px 16px 12px}
  .year{font-size:27px}
  .title{font-size:18px}
  .desc{font-size:12.5px;line-height:1.75}
  .node{width:280px;margin-right:130px}
  .up .card{bottom:calc(100% - var(--axisY,50%) + 50px)}
  .down .card{top:calc(var(--axisY,50%) + 50px)}
}
@media (max-width:760px){
  :root{--edge:20px}
  .panel{width:74vw}
  .node{width:262px;margin-right:96px}
  .brand span:last-child{display:none}
  .era{font-size:13px;letter-spacing:2px}
  .hint{font-size:11px;letter-spacing:2px}
  #gantt{left:6px;right:6px;height:60vh}
  .g-play i{max-width:30vw}
}
</style>
</head>
<body>
<div class="stage">
  <div id="viewport">
    <div class="bg" id="farLayer"></div>
    <div class="bg" id="midLayer"></div>
    <div class="bg" id="nearLayer"></div>
    <div id="sunLayer"></div>
    <div class="mist"></div>
    <div class="mist m2"></div>
    <div id="track">
      <div class="axis"></div>
      <section class="panel intro" id="intro">
        <div class="intro-core">
          <div class="vcol">
            <div class="vsub">五千年文明 · 十五处路标</div>
            <span class="seal">观史</span>
          </div>
          <h1 class="vtitle">华夏长卷</h1>
        </div>
        <div class="intro-hint">滚动滚轮或拖拽 · 向右展开长卷</div>
      </section>
      <section class="panel outro" id="outro">
        <div class="intro-core">
          <div class="vcol">
            <div class="vsub">以史为鉴 · 可以知兴替</div>
            <span class="seal">卷终</span>
          </div>
          <h2 class="vtitle">卷终</h2>
        </div>
      </section>
    </div>
    <div class="edge edge-l"></div>
    <div class="edge edge-r"></div>
  </div>
  <div class="roller roller-l"><span class="cap cap-t"></span><span class="cap cap-b"></span></div>
  <div class="roller roller-r"><span class="cap cap-t"></span><span class="cap cap-b"></span></div>
</div>

<header class="hud">
  <div class="brand"><span class="seal">史卷</span><span>华夏长卷</span></div>
  <div class="progress">
    <div class="track-bar" id="progressTrack"><div class="fill" id="progressFill"></div></div>
    <div class="era" id="eraLabel">卷首 · 华夏长卷</div>
  </div>
</header>

<div class="hint" id="hint">滚轮 · 拖拽 · ← → 浏览长卷 · G 或下方按钮展开泳道时间线</div>
<button id="ganttToggle" aria-label="展开泳道时间线">
  <svg viewBox="0 0 16 16" width="16" height="16" fill="#a63b28" aria-hidden="true"><rect x="1" y="2.2" width="8.5" height="2.6" rx="1"/><rect x="5" y="6.7" width="10" height="2.6" rx="1"/><rect x="2.5" y="11.2" width="7" height="2.6" rx="1"/></svg>
  泳道时间线
</button>
<section id="gantt" aria-hidden="true">
  <div class="g-head">
    <span class="g-title">历代政权 · 泳道时间线</span>
    <button class="g-btn" id="gZoomIn">放大</button>
    <button class="g-btn" id="gZoomOut">缩小</button>
    <button class="g-btn" id="gReset">重置</button>
    <button class="g-btn" id="gClose">收起</button>
  </div>
  <div class="g-body">
    <div class="g-main" id="gMain">
      <div class="g-axis" id="gAxis"></div>
      <div class="g-canvas" id="gCanvas"></div>
      <div class="g-play" id="gPlay"><i></i></div>
      <div class="g-tip" id="gTip"></div>
    </div>
  </div>
</section>
<div class="grain"></div>

<script>
const NODES=[

  {p:'',n:'1644',y:1644,era:'明清',title:'清军入关',desc:'明清鼎革,定鼎北京。康乾盛世之后闭关自守,大变局在承平中酝酿。'},

  {p:'',n:'1949',y:1949,era:'近现代',title:'开国大典',desc:'天安门城楼上一声宣告:中国人民从此站起来了。历史翻开新页。'},

];

const $=s=>document.querySelector(s);
const viewport=$('#viewport'),track=$('#track'),fill=$('#progressFill'),
      eraLabel=$('#eraLabel'),hint=$('#hint'),tickBar=$('#progressTrack'),
      far=$('#farLayer'),mid=$('#midLayer'),near=$('#nearLayer'),sun=$('#sunLayer');

let current=0,target=0,maxScroll=0,anchors=[0],
    lastInput=0,dragging=false,activeAnchor=-1;

const clamp=v=>Math.max(0,Math.min(maxScroll,v));

function buildNodes(){
  const frag=document.createDocumentFragment();
  NODES.forEach((n,i)=>{
    const el=document.createElement('article');
    el.className='node '+(i%2?'down':'up');
    el.dataset.idx=i;
    el.innerHTML=
      '<div class="card"><span class="chip">'+n.era+'</span>'+
      '<h3 class="year"><em>'+n.p+'</em>'+n.n+'</h3>'+
      '<h4 class="title">'+n.title+'</h4>'+
      '<p class="desc">'+n.desc+'</p></div>'+
      '<span class="connector"></span><span class="dot"></span>';
    frag.appendChild(el);
  });
  track.insertBefore(frag,$('#outro'));
}

function buildTicks(){
  tickBar.querySelectorAll('.tick').forEach(t=>t.remove());
  if(maxScroll<=0)return;
  NODES.forEach((n,i)=>{
    const b=document.createElement('button');
    b.className='tick';
    b.dataset.idx=i;
    b.style.left=(anchors[i+1]/maxScroll*100)+'%';
    b.setAttribute('aria-label',n.era+' · '+n.title);
    b.title=n.era+' · '+n.title;
    tickBar.appendChild(b);
  });
}

function measure(){
  const ratio=maxScroll>0?current/maxScroll:0;
  const W=viewport.clientWidth;
  maxScroll=Math.max(0,track.scrollWidth-W);
  anchors=[0];
  track.querySelectorAll('.node').forEach(el=>{
    anchors.push(clamp(el.offsetLeft+el.offsetWidth/2-W/2));
  });
  anchors.push(maxScroll);
  buildTicks();
  current=target=clamp(ratio*maxScroll);
}

function nearestAnchorIdx(v){
  let bi=0,bd=Infinity;
  anchors.forEach((a,i)=>{const d=Math.abs(a-v);if(d<bd){bd=d;bi=i}});
  return bi;
}

function apply(){
  track.style.transform='translate3d('+(-current)+'px,0,0)';
  far.style.backgroundPositionX=(-current*0.05)+'px';
  mid.style.backgroundPositionX=(-current*0.13)+'px';
  near.style.backgroundPositionX=(-current*0.24)+'px';
  sun.style.transform='translate3d('+(-current*0.028)+'px,0,0)';
  if(maxScroll>0)fill.style.width=(current/maxScroll*100)+'%';
  const ni=nearestAnchorIdx(current);
  if(ni!==activeAnchor){
    activeAnchor=ni;
    track.querySelectorAll('.node.active').forEach(e=>e.classList.remove('active'));
    tickBar.querySelectorAll('.tick.active').forEach(e=>e.classList.remove('active'));
    if(ni>0&&ni<=NODES.length){
      const el=track.querySelector('.node[data-idx="'+(ni-1)+'"]');
      const tk=tickBar.querySelector('.tick[data-idx="'+(ni-1)+'"]');
      if(el)el.classList.add('active');
      if(tk)tk.classList.add('active');
      const n=NODES[ni-1];
      eraLabel.textContent=n.era+' · '+(n.p?n.p+' ':'')+n.n+' 年';
      syncGanttHighlight(ni-1);
    }else{
      eraLabel.textContent=ni===0?'卷首 · 华夏长卷':'卷终 · 以史为鉴';
    }
  }
}

function frame(){
  const now=performance.now();
  if(!dragging&&now-lastInput>200){
    const i=nearestAnchorIdx(target);
    const d=anchors[i]-target;
    const g1=i>0?anchors[i]-anchors[i-1]:Infinity;
    const g2=i<anchors.length-1?anchors[i+1]-anchors[i]:Infinity;
    if(Math.abs(d)<Math.min(g1,g2)*0.45)target+=d*0.08;
  }
  if(!dragging)current+=(target-current)*0.12;
  apply();
  requestAnimationFrame(frame);
}

let hintGone=false;
function poke(){
  if(hintGone)return;
  hintGone=true;
  hint.classList.add('hidden');
}

addEventListener('wheel',e=>{
  if(e.ctrlKey)return;
  e.preventDefault();
  let d=e.deltaY+e.deltaX;
  if(e.deltaMode===1)d*=16;else if(e.deltaMode===2)d*=viewport.clientWidth;
  target=clamp(target+d*1.6);
  lastInput=performance.now();
  poke();
},{passive:false});

let px=0,moved=0,vel=0,lastX=0,lastT=0;
viewport.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  dragging=true;moved=0;vel=0;
  px=lastX=e.clientX;lastT=performance.now();
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add('grabbing');
});
viewport.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const now=performance.now(),x=e.clientX,dx=x-px;
  moved+=Math.abs(dx);
  target=current=clamp(target-dx);
  const dt=Math.max(now-lastT,1);
  vel=vel*0.7+((x-lastX)/dt)*0.3;
  px=lastX=x;lastT=now;lastInput=now;
});
function endDrag(){
  if(!dragging)return;
  dragging=false;
  viewport.classList.remove('grabbing');
  target=clamp(target-Math.max(-2400,Math.min(2400,vel*230)));
  lastInput=performance.now();
  poke();
}
viewport.addEventListener('pointerup',endDrag);
viewport.addEventListener('pointercancel',endDrag);

track.addEventListener('click',e=>{
  if(moved>6)return;
  const el=e.target.closest('.node');
  if(el)goToAnchor(1+ +el.dataset.idx);
});
tickBar.addEventListener('click',e=>{
  const t=e.target.closest('.tick');
  if(t)goToAnchor(1+ +t.dataset.idx);
});

function goToAnchor(i){
  i=Math.max(0,Math.min(anchors.length-1,i));
  target=anchors[i];
  lastInput=performance.now();
  poke();
}
function nav(dir){
  const ni=nearestAnchorIdx(current+dir*10);
  let i=Math.max(0,Math.min(anchors.length-1,ni+dir));
  while(i>0&&i<anchors.length-1&&anchors[i]===anchors[ni])i+=dir;
  goToAnchor(i);
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){nav(1);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='PageUp'){nav(-1);e.preventDefault();}
  else if(k==='Home'){goToAnchor(0);e.preventDefault();}
  else if(k==='End'){goToAnchor(anchors.length-1);e.preventDefault();}
  else if(k==='g'||k==='G'){toggleGantt();e.preventDefault();}
  else if(k==='Escape'){toggleGantt(false);}
  else if(k==='+'||k==='='){if(ganttEl.classList.contains('open'))zoomG(.5,1.35);}
  else if(k==='-'){if(ganttEl.classList.contains('open'))zoomG(.5,1/1.35);}
});

let rz=null;
addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{measure();renderGantt();})});

const PALETTE={
  '先秦':{f:'#6f6d5f',b:'#4e4c40'},
  '秦汉':{f:'#8a5a3a',b:'#63401f'},
  '魏晋南北朝':{f:'#5e7a5a',b:'#42573f'},
  '隋唐':{f:'#96473a',b:'#6e3025'},
  '宋元':{f:'#41586e',b:'#2c3d4e'},
  '明清':{f:'#3f4a6b',b:'#2a3247'},
  '近现代':{f:'#a63b28',b:'#7c2a1c'}
};
const ganttEl=$('#gantt'),gCanvas=$('#gCanvas'),gAxis=$('#gAxis'),
      gTip=$('#gTip'),gPlay=$('#gPlay'),gMain=$('#gMain'),gToggle=$('#ganttToggle');
const LANE_H=26;
let gView={t0:T_MIN,t1:T_MAX},gDrag=null,gMoved=0,gActiveYear=null,gFlag='',
    gLanes=[],gLaneOf=[];

function fmtYear(y){return y<0?'前'+(-y):(y===0?'元年':''+y)}

function packLanes(){
  const order=ENTRIES.map((d,i)=>i).sort((a,b)=>{
    const A=ENTRIES[a],B=ENTRIES[b];
    if(A.s!==B.s)return A.s-B.s;
    const am=A.m?1:0,bm=B.m?1:0;
    if(am!==bm)return bm-am;
    return B.e-A.e;
  });
  const fits=(d,l)=>d.s>l.end||(d.m&&d.s===l.end);
  gLanes=[];gLaneOf=[];
  order.forEach(i=>{
    const d=ENTRIES[i];
    let li=gLanes.findIndex(l=>fits(d,l));
    if(li<0){gLanes.push({end:d.e,items:[]});li=gLanes.length-1;}
    else gLanes[li].end=d.e;
    gLanes[li].items.push(i);
    gLaneOf[i]=li;
  });
}

function renderGantt(){
  const W=gCanvas.clientWidth;
  if(!W)return;
  gCanvas.innerHTML='';
  gAxis.innerHTML='';
  const span=gView.t1-gView.t0;
  const x=t=>(t-gView.t0)/span*W;
  const step=[2000,1000,500,200,100,50,20,10,5,2,1].find(s=>span/s<=12)||1;
  for(let t=Math.ceil(gView.t0/step)*step;t<=gView.t1;t+=step){
    const tk=document.createElement('div');
    tk.className='g-tick';
    tk.style.left=(x(t)/W*100)+'%';
    tk.textContent=fmtYear(t);
    gAxis.appendChild(tk);
    const g=document.createElement('div');
    g.className='g-grid';
    g.style.left=(x(t)/W*100)+'%';
    gCanvas.appendChild(g);
  }
  gLanes.forEach((lane,li)=>{
    const row=document.createElement('div');
    row.className='g-row';
    row.style.top=li*LANE_H+'px';
    gCanvas.appendChild(row);
    lane.items.forEach((idx,k)=>{
      const d=ENTRIES[idx];
      const l=x(d.s),r=x(d.e);
      if(r<=0||l>=W)return;
      const cl=Math.max(l,0),cr=Math.min(r,W);
      const bar=document.createElement('div');
      bar.className='g-bar';
      bar.dataset.i=idx;
      bar.style.left=cl+'px';
      bar.style.width=Math.max(2,cr-cl)+'px';
      const p=PALETTE[d.g];
      bar.style.background=p.f;
      bar.style.borderColor=p.b;
      const lblW=d.n.length*13+12;
      if(cr-cl>lblW+8){
        bar.innerHTML='<span>'+d.n+'</span>';
      }else{
        const lim=k+1<lane.items.length?x(ENTRIES[lane.items[k+1]].s):W;
        if(lim-cr>lblW+8&&cr+6+lblW<=W){
          const lb=document.createElement('span');
          lb.className='g-lbl';
          lb.textContent=d.n;
          lb.style.left=(cr+6)+'px';
          row.appendChild(lb);
        }
      }
      row.appendChild(bar);
    });
  });
  gCanvas.style.height=gLanes.length*LANE_H+'px';
  if(gActiveYear!=null)syncBars(gActiveYear);
  positionPlayhead();
}

function syncBars(y){
  gCanvas.querySelectorAll('.g-bar.on').forEach(e=>e.classList.remove('on'));
  ENTRIES.forEach((d,i)=>{
    if(y>=d.s&&y<=d.e){
      const b=gCanvas.querySelector('.g-bar[data-i="'+i+'"]');
      if(b)b.classList.add('on');
    }
  });
}

function positionPlayhead(){
  if(gActiveYear==null){gPlay.style.display='none';return}
  const W=gCanvas.clientWidth;
  if(!W)return;
  const x=(gActiveYear-gView.t0)/(gView.t1-gView.t0)*W;
  gPlay.style.display=(x<-4||x>W+4)?'none':'block';
  gPlay.style.left=x+'px';
  gPlay.querySelector('i').textContent=gFlag;
}

function syncGanttHighlight(idx){
  if(idx==null||idx<0)return;
  const n=NODES[idx];
  gActiveYear=n.y;
  gFlag=n.title+' · '+fmtYear(n.y);
  syncBars(n.y);
  positionPlayhead();
}

function toggleGantt(force){
  const open=force!==undefined?force:!ganttEl.classList.contains('open');
  ganttEl.classList.toggle('open',open);
  ganttEl.setAttribute('aria-hidden',String(!open));
  document.body.classList.toggle('gantt-open',open);
  if(open)renderGantt();
}

function zoomG(fx,f){
  const span0=gView.t1-gView.t0;
  const span=Math.min(Math.max(span0/f,20),T_MAX-T_MIN);
  const tc=gView.t0+span0*fx,k=span/span0;
  let t0=tc-(tc-gView.t0)*k,t1=t0+span;
  if(t0<T_MIN){t0=T_MIN;t1=t0+span}
  if(t1>T_MAX){t1=T_MAX;t0=t1-span}
  gView={t0,t1};
  renderGantt();
}

function panG(dy){
  const span=gView.t1-gView.t0;
  const t0=Math.min(Math.max(gView.t0+dy,T_MIN),T_MAX-span);
  gView={t0,t1:t0+span};
  renderGantt();
}

gToggle.addEventListener('click',()=>{toggleGantt();poke();});
$('#gClose').addEventListener('click',()=>toggleGantt(false));
$('#gZoomIn').addEventListener('click',()=>zoomG(.5,1.35));
$('#gZoomOut').addEventListener('click',()=>zoomG(.5,1/1.35));
$('#gReset').addEventListener('click',()=>{gView={t0:T_MIN,t1:T_MAX};renderGantt();});

ganttEl.addEventListener('wheel',e=>{
  e.preventDefault();
  e.stopPropagation();
  const r=gCanvas.getBoundingClientRect();
  const fx=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
  if(e.ctrlKey||e.metaKey)zoomG(fx,e.deltaY>0?1/1.3:1.3);
  else panG((e.deltaY+e.deltaX)*(gView.t1-gView.t0)/r.width);
},{passive:false});

gCanvas.addEventListener('pointerdown',e=>{
  gDrag={x:e.clientX,t0:gView.t0,span:gView.t1-gView.t0,w:gCanvas.clientWidth};
  gMoved=0;
  gTip.style.display='none';
  gCanvas.setPointerCapture(e.pointerId);
});
gCanvas.addEventListener('pointermove',e=>{
  if(!gDrag)return;
  const dx=e.clientX-gDrag.x;
  gMoved+=Math.abs(dx);
  panG(-dx/gDrag.w*gDrag.span);
});
['pointerup','pointercancel'].forEach(ev=>gCanvas.addEventListener(ev,()=>gDrag=null));

gCanvas.addEventListener('mousemove',e=>{
  if(gDrag)return;
  const b=e.target.closest('.g-bar');
  if(!b){gTip.style.display='none';return}
  const d=ENTRIES[+b.dataset.i];
  const dur=(d.now?NOW:d.e)-d.s;
  gTip.innerHTML='<b>'+d.n+'</b><span class="y">'+(d.ap?'约':'')+fmtYear(d.s)+' — '
    +(d.now?'今':(d.ap?'约':'')+fmtYear(d.e))+' · '+dur+'年</span><p>'+d.tip+'</p>';
  const mr=gMain.getBoundingClientRect();
  let tx=e.clientX-mr.left+14,ty=e.clientY-mr.top+14;
  if(tx>mr.width-200)tx-=224;
  gTip.style.left=tx+'px';
  gTip.style.top=Math.max(4,ty-24)+'px';
  gTip.style.display='block';
});
gCanvas.addEventListener('mouseleave',()=>gTip.style.display='none');

gCanvas.addEventListener('click',e=>{
  if(gMoved>6)return;
  const b=e.target.closest('.g-bar');
  if(!b)return;
  const d=ENTRIES[+b.dataset.i];
  const inSpan=NODES.map((n,j)=>({j,dd:Math.abs(n.y-(d.s+d.e)/2)}))
    .filter(o=>NODES[o.j].y>=d.s&&NODES[o.j].y<=d.e);
  let pick;
  if(inSpan.length){
    inSpan.sort((a,b2)=>a.dd-b2.dd);
    pick=inSpan[0].j;
  }else{
    let bi=-1;
    NODES.forEach((n,j)=>{if(n.y<d.s)bi=j});
    const ai=NODES.findIndex(n=>n.y>d.e);
    const db=bi>=0?d.s-NODES[bi].y:Infinity;
    const da=ai>=0?NODES[ai].y-d.e:Infinity;
    pick=(da<=250&&da<db)?ai:(bi>=0?bi:Math.max(ai,0));
  }
  goToAnchor(pick+1);
  poke();
});

gCanvas.addEventListener('dblclick',e=>{
  if(gMoved>6)return;
  const b=e.target.closest('.g-bar');
  if(!b)return;
  const d=ENTRIES[+b.dataset.i];
  const pad=(d.e-d.s)*0.35+25;
  let t0=Math.max(T_MIN,d.s-pad),t1=Math.min(T_MAX,d.e+pad);
  if(t1-t0<20)t1=t0+20;
  gView={t0,t1};
  renderGantt();
});

buildNodes();
measure();
packLanes();
renderGantt();
requestAnimationFrame(frame);
</script>
</body>
</html>
